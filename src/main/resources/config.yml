# Пример конфигурации плагина WMine
location:
  world: world
  minX: 1181
  minY: 106
  minZ: 1018
  maxX: 1189
  maxY: 112
  maxZ: 1026

# Список блоков, доступных в шахте
# block  — Bukkit Material
# cost   — базовая награда за блок
# chance — поле для совместимости/будущего функционала
blocks:
  1:
    block: COAL_ORE
    cost: 1
    chance: 50
  2:
    block: IRON_ORE
    cost: 2
    chance: 40
  3:
    block: GOLD_ORE
    cost: 3
    chance: 30
  4:
    block: DIAMOND_ORE
    cost: 4
    chance: 20
  5:
    block: EMERALD_ORE
    cost: 5
    chance: 10

# Настройки восстановления блоков (в тиках)
settings:
  stone-restore-delay: 1
  block-respawn-delay: 200

# Значения по умолчанию для новых игроков
defaultValues:
  backpack: 50
  costmultiplier: 1.0

# При true блоки могут размещаться случайно (если реализовано в логике)
randomPlace: false
